[package]
name = "deckrypt"
version = "0.5.0"
edition = "2021"
links = "keymap"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
env_logger = "0.11.6"
evdev = "0.12.2"
hidapi = "2.6.4"
libc = "0.2.169"
log = "0.4.22"
sudo = "0.6.0"
toml = "0.8.19"
wayland-client = "0.31.11"
xkbcommon = { version = "0.9", features = ["wayland"] }

[build-dependencies]
cc = "1.2"
